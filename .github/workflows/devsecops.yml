name: Automatisation des tests DevSecOps

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  Dependances:
    name: Contrôle des dépendances
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Scanner requirements.txt avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

  Dockerfile:
    name: Contrôle du Dockerfile
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Scanner le Dockerfile avec Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  Deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Vérifier que les contrôles sont passés
        run: echo "L'application est prête à être déployée"
